name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check --output-format=github .

      - name: Run Ty (type checker)
        run: uv run ty check --output-format=github .

      - name: Run pytest
        run: uv run pytest --cov --junitxml=junit.xml -o junit_family=legacy

      - name: Upload results to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.14' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report-type: test_results

  # Checks that the lower bounds declared in pyproject.toml really work.
  # Only project dependencies are lowered: an unbounded dev tool like pytest would resolve to 2.0.0.
  lowest-direct:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install the project with the lowest allowed dependencies
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e .
          uv pip install pytest pytest-asyncio

      - name: Run pytest
        run: uv run --no-sync pytest
